name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Tag matches the workspace version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          workspace="$(awk -F'"' '/^\[workspace.package\]/{p=1} p&&/^version/{print $2; exit}' Cargo.toml)"
          if [ "$tag" != "$workspace" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${workspace} in Cargo.toml" >&2
            exit 1
          fi
          echo "version=${workspace}" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin, platform: darwin-aarch64, arch: aarch64, formats: "app,dmg" }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, platform: darwin-x86_64, arch: x64, formats: "app,dmg" }
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux-x86_64, arch: x64, formats: "deb,appimage" }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-aarch64, arch: aarch64, formats: "deb,appimage" }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x86_64, arch: x64, formats: "nsis,wix" }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, platform: windows-aarch64, arch: aarch64, formats: "nsis,wix" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d
        with:
          install_args: cargo-binstall cargo:cargo-packager
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: release-${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc g++ clang file libfontconfig-dev \
            libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev libzstd-dev libasound2-dev libvulkan-dev libvulkan1
      - name: Signing key is configured
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: '[ -n "$KEY" ] || { echo "TAURI_SIGNING_PRIVATE_KEY is not set" >&2; exit 1; }'
      - name: Build
        run: cargo build --release --locked -p margin-desktop
      - name: Package and sign
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: cargo packager --release -p margin-desktop --formats ${{ matrix.formats }} --out-dir dist
      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          out=dist
          mkdir -p staging
          stage() {
            local matches=("$out"/$1)
            [ "${#matches[@]}" -eq 1 ] || { echo "expected one $1, found ${#matches[@]}" >&2; exit 1; }
            [ -f "${matches[0]}.sig" ] || { echo "missing signature for ${matches[0]}" >&2; exit 1; }
            cp "${matches[0]}" "staging/$2"
            cp "${matches[0]}.sig" "staging/$2.sig"
          }
          case "${{ runner.os }}" in
            macOS)
              stage "*.dmg" "Margin_${VERSION}_${ARCH}.dmg"
              stage "Margin.app.tar.gz" "Margin_${VERSION}_${ARCH}.app.tar.gz"
              ;;
            Windows)
              stage "*-setup.exe" "Margin_${VERSION}_${ARCH}-setup.exe"
              stage "*.msi" "Margin_${VERSION}_${ARCH}.msi"
              ;;
            Linux)
              stage "*.AppImage" "Margin_${VERSION}_${ARCH}.AppImage"
              stage "*.deb" "Margin_${VERSION}_${ARCH}.deb"
              ;;
          esac
          ls -la staging
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.platform }}
          path: staging/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Generate updater manifest (latest.json)
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          platforms='{}'
          for entry in \
            "darwin-aarch64 Margin_${VERSION}_aarch64.app.tar.gz" \
            "darwin-x86_64 Margin_${VERSION}_x64.app.tar.gz" \
            "linux-x86_64 Margin_${VERSION}_x64.AppImage" \
            "linux-aarch64 Margin_${VERSION}_aarch64.AppImage" \
            "windows-x86_64 Margin_${VERSION}_x64-setup.exe" \
            "windows-aarch64 Margin_${VERSION}_aarch64-setup.exe"; do
            read -r key file <<< "$entry"
            platforms="$(jq --arg key "$key" --arg url "${base}/${file}" \
              --rawfile signature "artifacts/${file}.sig" \
              '. + {($key): {signature: $signature, url: $url}}' <<< "$platforms")"
          done
          jq -n --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{version: $version, notes: "", pub_date: $date, platforms: $platforms}' > artifacts/latest.json
          cat artifacts/latest.json
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
