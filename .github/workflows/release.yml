name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tauri-build:
    name: App — Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            runner: macos-14
            target: x86_64-apple-darwin
          - name: Linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install JS dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: app/src-tauri -> target

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev

      - name: Build Tauri app
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --target ${{ matrix.target }}

      - name: Collect artifacts into flat staging dir
        shell: bash
        run: |
          mkdir -p staging
          TARGET="${{ matrix.target }}"
          BUNDLE="app/src-tauri/target/${TARGET}/release/bundle"

          if [[ "$TARGET" == *apple* ]]; then
            SHORT=$([[ "$TARGET" == aarch64* ]] && echo "aarch64" || echo "x64")
            for f in "$BUNDLE"/dmg/*.dmg; do [ -f "$f" ] && cp "$f" staging/; done
            for f in "$BUNDLE"/macos/*.app.tar.gz; do
              [ -f "$f" ] && cp "$f" "staging/Margin_${SHORT}.app.tar.gz"
            done
            for f in "$BUNDLE"/macos/*.app.tar.gz.sig; do
              [ -f "$f" ] && cp "$f" "staging/Margin_${SHORT}.app.tar.gz.sig"
            done
          fi

          if [[ "$TARGET" == *linux* ]]; then
            for f in "$BUNDLE"/appimage/*.AppImage; do [ -f "$f" ] && cp "$f" staging/; done
            for f in "$BUNDLE"/appimage/*.AppImage.sig; do [ -f "$f" ] && cp "$f" staging/; done
            for f in "$BUNDLE"/deb/*.deb; do [ -f "$f" ] && cp "$f" staging/; done
          fi

          if [[ "$TARGET" == *windows* ]]; then
            for f in "$BUNDLE"/nsis/*.exe; do [ -f "$f" ] && cp "$f" staging/; done
            for f in "$BUNDLE"/nsis/*.exe.sig; do [ -f "$f" ] && cp "$f" staging/; done
            for f in "$BUNDLE"/msi/*.msi; do [ -f "$f" ] && cp "$f" staging/; done
            for f in "$BUNDLE"/msi/*.msi.sig; do [ -f "$f" ] && cp "$f" staging/; done
          fi

          echo "=== Staged artifacts ==="
          ls -la staging/

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tauri-${{ matrix.target }}
          path: staging/*
          if-no-files-found: ignore

  publish-release:
    name: Publish GitHub Release
    needs: [tauri-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: tauri-*
          path: artifacts
          merge-multiple: true

      - name: List all artifacts
        run: |
          echo "=== All downloaded artifacts ==="
          find artifacts -type f | sort

      - name: Generate updater manifest (latest.json)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BASE="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"

          read_sig() {
            local f
            f=$(find artifacts -name "$1" -type f 2>/dev/null | head -1)
            if [ -n "$f" ] && [ -f "$f" ]; then cat "$f"; else echo ""; fi
          }

          DARWIN_AARCH64_SIG=$(read_sig "Margin_aarch64.app.tar.gz.sig")
          DARWIN_X86_SIG=$(read_sig "Margin_x64.app.tar.gz.sig")
          LINUX_SIG=$(read_sig "*.AppImage.sig")
          WINDOWS_SIG=$(read_sig "*.exe.sig")

          cat > latest.json <<-EOF
          {
            "version": "${VERSION}",
            "pub_date": "${DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${DARWIN_AARCH64_SIG}",
                "url": "${BASE}/Margin_aarch64.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "${DARWIN_X86_SIG}",
                "url": "${BASE}/Margin_x64.app.tar.gz"
              },
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "${BASE}/Margin_${VERSION}_amd64.AppImage"
              },
              "windows-x86_64": {
                "signature": "${WINDOWS_SIG}",
                "url": "${BASE}/Margin_${VERSION}_x64-setup.exe"
              }
            }
          }
          EOF

          echo "=== latest.json ==="
          cat latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          generate_release_notes: true
          files: |
            artifacts/*
            latest.json
