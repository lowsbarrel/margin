name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  conventions:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9./-]+\))?!?: .+'
          echo "$TITLE" | grep -qE "$pattern" || { echo "PR title must be Conventional Commits"; exit 1; }
          [ "${#TITLE}" -le 72 ] || { echo "PR title over 72 characters"; exit 1; }
      - name: Commit messages follow Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9./-]+\))?!?: .+'
          bad=0
          while IFS= read -r subject; do
            case "$subject" in "Merge "*) continue ;; esac
            echo "$subject" | grep -qE "$pattern" || { echo "not conventional: $subject"; bad=1; }
            [ "${#subject}" -le 72 ] || { echo "over 72 characters: $subject"; bad=1; }
          done < <(git log --format=%s "$BASE".."$HEAD")
          exit "$bad"

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc g++ clang libfontconfig-dev \
            libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libzstd-dev libasound2-dev libvulkan1
      - run: mise run setup
      - run: mise run fmt:check
      - run: taplo fmt --check
      - run: taplo check
      - run: typos
      - run: mise run check
      - run: mise run doc

  rust:
    name: rust (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc g++ clang libfontconfig-dev \
            libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libzstd-dev libasound2-dev \
            libvulkan1 mesa-vulkan-drivers
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: mise run test

  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: bundle
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc g++ clang libfontconfig-dev \
            libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libzstd-dev libasound2-dev libvulkan1
      - run: cargo packager --release -p margin-desktop --formats deb

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  ci:
    if: ${{ always() }}
    needs: [conventions, repository, rust, bundle, trivy]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        run: |
          for result in "${{ needs.conventions.result }}" "${{ needs.repository.result }}" \
            "${{ needs.rust.result }}" "${{ needs.bundle.result }}" "${{ needs.trivy.result }}"; do
            case "$result" in
              success | skipped) ;;
              *) echo "required job did not succeed: $result"; exit 1 ;;
            esac
          done
