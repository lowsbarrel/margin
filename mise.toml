[tools]
cargo-binstall = "1.26.1"
"cargo:cargo-nextest" = "0.9.150"
"cargo:cargo-shear" = "1.14.0"
"cargo:cargo-packager" = "0.11.8"
cargo-deny = "0.20.2"
typos = "1.51.1"
taplo = "0.10.0"
lefthook = "2.2.2"
node = "24"
"npm:jscpd" = "5.4.2"

[settings]
cargo.binstall = true

[env]
NIGHTLY = "nightly-2026-10-27"

[tasks.setup]
description = "Install the nightly rustfmt and the git hooks"
run = [
  "rustup toolchain install {{env.NIGHTLY}} --profile minimal --component rustfmt",
  "lefthook install",
]

[tasks.dev]
description = "Run the desktop app"
run = "cargo run -p margin-desktop"

[tasks.fmt]
description = "Format Rust and TOML"
run = ["cargo +{{env.NIGHTLY}} fmt --all", "taplo fmt"]

[tasks."fmt:check"]
description = "Check Rust formatting"
run = "cargo +{{env.NIGHTLY}} fmt --all --check"

[tasks.lint]
description = "Check formatting, lints and spelling"
depends = ["fmt:check"]
run = [
  "taplo fmt --check",
  "taplo check",
  "typos",
  "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings",
]

[tasks.check]
description = "Repository invariants, dependency rules, licenses, advisories, unused deps, duplication"
run = ["cargo xtask check", "cargo deny --locked check", "cargo shear", "jscpd"]

[tasks.test]
description = "Unit, use-case, conformance, UI and end-to-end tests"
run = [
  "cargo nextest run --workspace --all-features --locked --no-tests=pass",
  "cargo test --workspace --doc --locked",
]

[tasks.doc]
description = "Build the API docs with warnings denied"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --no-deps --document-private-items --locked"

[tasks.gate]
description = "Everything CI runs"
depends = ["lint", "check", "test", "doc"]

[tasks.bundle]
description = "Build installers and, with CARGO_PACKAGER_SIGN_PRIVATE_KEY set, signed updater artifacts for the host target"
run = "cargo packager --release -p margin-desktop --formats {% if os() == 'macos' %}app,dmg{% elif os() == 'windows' %}nsis,wix{% else %}deb,appimage{% endif %}"
