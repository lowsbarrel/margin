[package]
name = "margin-desktop"
description = "Margin, a local-first Markdown editor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "margin"
path = "src/main.rs"

[dependencies]
async-channel.workspace = true
base64.workspace = true
gpui-kit.workspace = true
margin-ask.workspace = true
margin-attachments.workspace = true
margin-canvas.workspace = true
margin-crypto.workspace = true
margin-editor.workspace = true
margin-editor-assets.workspace = true
margin-file-tree.workspace = true
margin-files.workspace = true
margin-fs.workspace = true
margin-history.workspace = true
margin-i18n.workspace = true
margin-kernel.workspace = true
margin-llm.workspace = true
margin-onboarding.workspace = true
margin-panels.workspace = true
margin-panes.workspace = true
margin-preferences.workspace = true
margin-pty.workspace = true
margin-s3.workspace = true
margin-search.workspace = true
margin-settings.workspace = true
margin-spotlight.workspace = true
margin-sqlite.workspace = true
margin-sync.workspace = true
margin-terminal.workspace = true
margin-terminals.workspace = true
margin-theme.workspace = true
margin-trash.workspace = true
margin-vaults.workspace = true
margin-viewers.workspace = true
margin-workbench.workspace = true
minisign-verify.workspace = true
parking_lot.workspace = true
regex.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
flate2.workspace = true
tar.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
margin-test-support.workspace = true

[lints]
workspace = true

[package.metadata.packager]
product-name = "Margin"
identifier = "com.lowsbarrel.margin"
publisher = "Alessandro Zucchiatti"
homepage = "https://github.com/lowsbarrel/margin"
category = "Productivity"
before-packaging-command = "cargo build --release -p margin-desktop"
icons = [
  "assets/icons/32x32.png",
  "assets/icons/128x128.png",
  "assets/icons/128x128@2x.png",
  "assets/icons/icon.icns",
  "assets/icons/icon.ico",
]

[package.metadata.packager.deb]
depends = [
  "libfontconfig1",
  "libfreetype6",
  "libvulkan1",
  "libwayland-client0",
  "libxcb1",
  "libxkbcommon0",
  "libxkbcommon-x11-0",
]
