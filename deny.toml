[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
exceptions = [
  { crate = "enum-iterator", allow = ["0BSD"] },
  { crate = "enum-iterator-derive", allow = ["0BSD"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { name = "openssl", reason = "TLS is rustls everywhere" },
  { name = "openssl-sys", reason = "TLS is rustls everywhere" },
  { name = "native-tls", reason = "TLS is rustls everywhere" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
