[workspace]
resolver = "3"
members = ["crates/*/*", "xtask"]
exclude = ["crates/target"]
default-members = ["crates/apps/desktop"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Alessandro Zucchiatti"]
repository = "https://github.com/lowsbarrel/margin"
publish = false

[workspace.dependencies]
aes-gcm-siv = "0.11"
alacritty_terminal = { version = "=0.26.0", default-features = false }
async-channel = "2.5"
base64 = "0.22"
bip39 = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "6"
filetime = "0.2"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gpui-kit = { version = "=0.8.1", default-features = false, features = [
  "component",
  "assets",
  "tree-sitter-bash",
  "tree-sitter-c",
  "tree-sitter-cpp",
  "tree-sitter-css",
  "tree-sitter-go",
  "tree-sitter-html",
  "tree-sitter-java",
  "tree-sitter-javascript",
  "tree-sitter-python",
  "tree-sitter-rust",
  "tree-sitter-sql",
  "tree-sitter-toml",
  "tree-sitter-tsx",
  "tree-sitter-typescript",
  "tree-sitter-yaml",
] }
hayro = { version = "=0.8.0", default-features = false, features = ["embed-fonts", "simd"] }
hex = "0.4"
hmac = "0.12"
html5ever = "0.38"
htmd = "0.5.6"
image = { version = "0.25", default-features = false }
margin-ask = { path = "crates/features/ask" }
margin-attachments = { path = "crates/features/attachments" }
margin-breadcrumbs = { path = "crates/ui/breadcrumbs" }
margin-canvas = { path = "crates/ui/canvas" }
margin-crypto = { path = "crates/shared/crypto" }
margin-dates = { path = "crates/shared/dates" }
margin-diagrams = { path = "crates/ui/diagrams" }
margin-editor = { path = "crates/ui/editor" }
margin-editor-actions = { path = "crates/ui/editor-actions" }
margin-editor-assets = { path = "crates/ui/editor-assets" }
margin-editor-commands = { path = "crates/ui/editor-commands" }
margin-editor-overlays = { path = "crates/ui/editor-overlays" }
margin-find-bar = { path = "crates/ui/find-bar" }
margin-live-preview = { path = "crates/ui/live-preview" }
margin-table-editing = { path = "crates/ui/table-editing" }
margin-text-buffer = { path = "crates/ui/text-buffer" }
margin-file-tree = { path = "crates/ui/file-tree" }
margin-files = { path = "crates/features/files" }
margin-fs = { path = "crates/adapters/fs" }
margin-history = { path = "crates/features/history" }
margin-i18n = { path = "crates/ui/i18n" }
margin-kernel = { path = "crates/shared/kernel" }
margin-llm = { path = "crates/adapters/llm" }
margin-markdown = { path = "crates/shared/markdown" }
margin-onboarding = { path = "crates/ui/onboarding" }
margin-panels = { path = "crates/ui/panels" }
margin-panes = { path = "crates/ui/panes" }
margin-preferences = { path = "crates/ui/preferences" }
margin-properties = { path = "crates/ui/properties" }
margin-pty = { path = "crates/adapters/pty" }
margin-s3 = { path = "crates/adapters/s3" }
margin-retry = { path = "crates/shared/retry" }
margin-search = { path = "crates/features/search" }
margin-settings = { path = "crates/features/settings" }
margin-spotlight = { path = "crates/ui/spotlight" }
margin-sqlite = { path = "crates/adapters/sqlite" }
margin-sync = { path = "crates/features/sync" }
margin-terminal = { path = "crates/ui/terminal" }
margin-terminals = { path = "crates/features/terminals" }
margin-test-support = { path = "crates/testing/support" }
margin-theme = { path = "crates/ui/theme" }
margin-trash = { path = "crates/features/trash" }
margin-vaults = { path = "crates/features/vaults" }
margin-viewers = { path = "crates/ui/viewers" }
margin-workbench = { path = "crates/ui/workbench" }
markup5ever_rcdom = "0.38"
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
minisign-verify = "=0.2.5"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
nucleo-matcher = "0.3"
parking_lot = "0.12"
portable-pty = "0.9"
rand = "0.10"
ratex-layout = "=0.1.15"
ratex-parser = "=0.1.15"
ratex-svg = { version = "=0.1.15", features = ["embed-fonts"] }
ratex-types = "=0.1.15"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
] }
resvg = { version = "0.46", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = { version = "2.7", default-features = false }
sys-locale = "0.3.2"
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
  "time",
  "sync",
  "macros",
] }
toml = "0.9"
unicode-segmentation = { version = "1", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
future_incompatible = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
meta_variable_misuse = "deny"
missing_debug_implementations = "deny"
non_ascii_idents = "deny"
redundant_lifetimes = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unnameable_types = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
missing_const_for_fn = "allow"
module_name_repetitions = "allow"
redundant_pub_crate = "allow"
option_if_let_else = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
significant_drop_tightening = "allow"
absolute_paths = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
assertions_on_result_states = "deny"
cfg_not_test = "deny"
clone_on_ref_ptr = "deny"
create_dir = "deny"
dbg_macro = "deny"
deref_by_slicing = "deny"
doc_include_without_cfg = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
exit = "deny"
field_scoped_visibility_modifiers = "deny"
filetype_is_file = "deny"
format_push_string = "deny"
get_unwrap = "deny"
if_then_some_else_none = "deny"
infinite_loop = "deny"
large_include_file = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
missing_asserts_for_indexing = "deny"
mixed_read_write_in_expression = "deny"
mod_module_files = "deny"
multiple_inherent_impl = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
needless_raw_strings = "deny"
partial_pub_fields = "deny"
pathbuf_init_then_push = "deny"
print_stderr = "deny"
print_stdout = "deny"
pub_without_shorthand = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
redundant_type_annotations = "deny"
ref_patterns = "deny"
renamed_function_params = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
str_to_string = "deny"
string_add = "deny"
string_lit_chars_any = "deny"
suspicious_xor_used_as_pow = "deny"
todo = "deny"
try_err = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unnecessary_self_imports = "deny"
unneeded_field_pattern = "deny"
unseparated_literal_suffix = "deny"
unused_result_ok = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
verbose_file_reads = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
